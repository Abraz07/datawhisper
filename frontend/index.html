/* ---- MAIN APP COMPONENT ---- */
function App() {
  // Auth state
  const [user, setUser] = useState(() => {
    try {
      const saved = localStorage.getItem('queryza_user_v1');
      return saved ? JSON.parse(saved) : null;
    } catch { return null; }
  });

  const [uploadsCount, setUploadsCount] = useState(() => {
    try {
      return Number(localStorage.getItem('queryza_uploads_v1') || 0);
    } catch { return 0; }
  });

  const [guestQueriesCount, setGuestQueriesCount] = useState(() => {
    try {
      return Number(localStorage.getItem('queryza_guest_queries_v1') || 0);
    } catch { return 0; }
  });

  const [authModalOpen, setAuthModalOpen] = useState(false);
  const [userMenuOpen, setUserMenuOpen] = useState(false);
  const [feedbackModalOpen, setFeedbackModalOpen] = useState(false);
  const [feedbackStars, setFeedbackStars] = useState(5);
  const [feedbackCategory, setFeedbackCategory] = useState('✨ Feature Request');
  const [feedbackComment, setFeedbackComment] = useState('');
  const [feedbackSent, setFeedbackSent] = useState(false);
  const [activeColPopover, setActiveColPopover] = useState(null);

  const [pendingUploadFile, setPendingUploadFile] = useState(null);
  const [pendingQuery, setPendingQuery] = useState(null);

  const loadSampleDataset = (sample) => {
    const csvContent = sample.generateCsv();
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const file = new File([blob], sample.filename, { type: 'text/csv' });
    handleFile(file);
  };

  const exportExecutiveReport = () => {
    window.print();
  };

  const submitGlobalFeedback = async (e) => {
    e.preventDefault();
    const feedbackPayload = {
      stars: feedbackStars,
      category: feedbackCategory,
      comment: feedbackComment || '',
      userEmail: user?.email || 'Guest',
      userName: user?.name || 'Guest',
      timestamp: new Date().toISOString()
    };
    try {
      if (db) {
        await db.collection("feedbacks").add({
          ...feedbackPayload,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    } catch (err) {
      console.warn("Firestore save:", err);
    }
    try {
      const stored = JSON.parse(localStorage.getItem('queryza_user_feedbacks_v1') || '[]');
      stored.push(feedbackPayload);
      localStorage.setItem('queryza_user_feedbacks_v1', JSON.stringify(stored));
    } catch (err) {}

    setFeedbackSent(true);
    setTimeout(() => {
      setFeedbackSent(false);
      setFeedbackModalOpen(false);
      setFeedbackComment('');
    }, 2000);
  };

  const [session, setSession] = useState(() => {
    try {
      const saved = localStorage.getItem('queryza_session_v1');
      return saved ? JSON.parse(saved) : null;
    } catch { return null; }
  });

  const [messages, setMessages] = useState(() => {
    try {
      const saved = localStorage.getItem('queryza_messages_v1');
      return saved ? JSON.parse(saved) : [];
    } catch { return []; }
  });

  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('queryza_theme_v1') || 'dark'; } catch { return 'dark'; }
  });

  const [accent, setAccent] = useState(() => {
    try { return localStorage.getItem('queryza_accent_v1') || 'emerald'; } catch { return 'emerald'; }
  });

  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [sheetPicker, setSheetPicker] = useState(null);
  const [previewModalOpen, setPreviewModalOpen] = useState(false);
  const [columnFilter, setColumnFilter] = useState('');
  const [serverStatus, setServerStatus] = useState('checking');

  const messagesStreamRef = useRef();
  const textareaRef = useRef();

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('queryza_theme_v1', theme); } catch (e) {}
  }, [theme]);

  useEffect(() => {
    document.documentElement.setAttribute('data-accent', accent);
    try { localStorage.setItem('queryza_accent_v1', accent); } catch (e) {}
  }, [accent]);

  useEffect(() => {
    try {
      if (session) localStorage.setItem('queryza_session_v1', JSON.stringify(session));
      else localStorage.removeItem('queryza_session_v1');
    } catch (e) {}
  }, [session]);

  useEffect(() => {
    try {
      if (messages && messages.length > 0) localStorage.setItem('queryza_messages_v1', JSON.stringify(messages));
      else localStorage.removeItem('queryza_messages_v1');
    } catch (e) {}
  }, [messages]);

  useEffect(() => {
    try {
      if (user) localStorage.setItem('queryza_user_v1', JSON.stringify(user));
      else localStorage.removeItem('queryza_user_v1');
    } catch (e) {}
  }, [user]);

  const scrollToBottom = () => {
    if (messagesStreamRef.current) {
      messagesStreamRef.current.scrollTop = messagesStreamRef.current.scrollHeight;
    }
  };

  useEffect(() => {
    scrollToBottom();
  }, [messages.length, loading]);

  useEffect(() => {
    let isMounted = true;
    const timer = setTimeout(() => {
      if (isMounted) setServerStatus(s => s === 'ready' ? 'ready' : 'waking');
    }, 1200);

    const checkHealth = async () => {
      try {
        const res = await fetch(`${API}/health`, { cache: 'no-store' });
        if (res.ok && isMounted) setServerStatus('ready');
        else if (isMounted) setServerStatus('error');
      } catch (e) {
        if (isMounted) setServerStatus('error');
      } finally {
        clearTimeout(timer);
      }
    };
    checkHealth();
    return () => { isMounted = false; clearTimeout(timer); };
  }, []);

  const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

  const handleRefresh = () => {
    window.location.reload();
  };

  // Listen to Firebase Auth state
  useEffect(() => {
    if (!auth) return;
    const unsubscribe = auth.onAuthStateChanged((fbUser) => {
      if (fbUser) {
        const profile = {
          name: fbUser.displayName || fbUser.email.split('@')[0],
          email: fbUser.email,
          avatar: fbUser.photoURL,
          uid: fbUser.uid,
          provider: 'google'
        };
        setUser(profile);
        setAuthModalOpen(false);
        try { localStorage.setItem('queryza_user_v1', JSON.stringify(profile)); } catch (e) {}
      }
    });
    return () => unsubscribe();
  }, []);

  // Google Sign-In Handler with Firebase Popup
  const handleGoogleSignIn = async () => {
    if (!auth || !googleProvider) {
      alert("Firebase Auth is loading. Please try again in a moment.");
      return;
    }
    try {
      const result = await auth.signInWithPopup(googleProvider);
      const fbUser = result.user;
      const profile = {
        name: fbUser.displayName || fbUser.email.split('@')[0],
        email: fbUser.email,
        avatar: fbUser.photoURL,
        uid: fbUser.uid,
        provider: 'google'
      };
      setUser(profile);
      setAuthModalOpen(false);

      if (pendingUploadFile) {
        const fileToUpload = pendingUploadFile;
        setPendingUploadFile(null);
        executeFileUpload(fileToUpload);
      } else if (pendingQuery) {
        const queryToRun = pendingQuery;
        setPendingQuery(null);
        sendMessage(queryToRun);
      }
    } catch (err) {
      if (err.code === 'auth/popup-closed-by-user') return;
      if (err.code === 'auth/unauthorized-domain') {
        alert("Domain Notice: Please add 'queryza.vercel.app' to Authorized Domains in your Firebase Console > Authentication > Settings > Authorized Domains.");
        return;
      }
      alert("Google Sign-In: " + err.message);
    }
  };

  const handleSignOut = async () => {
    if (auth) {
      try { await auth.signOut(); } catch (e) {}
    }
    setUser(null);
    setUserMenuOpen(false);
    localStorage.removeItem('queryza_user_v1');
  };

  const applySession = (data) => {
    setSession(data);
    setMessages([]);
    localStorage.setItem('queryza_session_v1', JSON.stringify(data));
    localStorage.removeItem('queryza_messages_v1');
    setSidebarOpen(false);
    setSheetPicker(null);
    setServerStatus('ready');
  };

  const uploadForm = async (form) => {
    const res = await fetch(`${API}/upload`, { method: 'POST', body: form });
    let body;
    try { body = await res.json(); } catch { body = {}; }
    if (!res.ok) {
      const detail = body.detail;
      throw new Error(typeof detail === 'string' ? detail : 'Upload failed');
    }
    return body;
  };

  const executeFileUpload = async (file) => {
    setUploading(true);
    const form = new FormData();
    form.append('file', file);
    try {
      // Cache file locally for silent background recovery if server restarts
      try {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            localStorage.setItem('queryza_active_file_data_v1', e.target.result);
            localStorage.setItem('queryza_active_file_name_v1', file.name);
          } catch (err) {}
        };
        reader.readAsDataURL(file);
      } catch (err) {}

      const data = await uploadForm(form);
      if (data.needs_sheet) {
        setSheetPicker({ file, sheets: data.sheets, filename: data.filename });
        return;
      }
      const newCount = uploadsCount + 1;
      setUploadsCount(newCount);
      localStorage.setItem('queryza_uploads_v1', String(newCount));
      applySession(data);
    } catch (e) { alert('Upload failed: ' + e.message); }
    finally { setUploading(false); }
  };

  const handleFile = async (file) => {
    if (!file) return;

    // Freemium Gate: If guest has already uploaded 1 file, prompt for sign-in
    if (!user && uploadsCount >= 1) {
      setPendingUploadFile(file);
      setAuthModalOpen(true);
      return;
    }

    executeFileUpload(file);
  };

  const selectSheet = async (sheet) => {
    if (!sheetPicker?.file) return;
    setUploading(true);
    const form = new FormData();
    form.append('file', sheetPicker.file);
    form.append('sheet', sheet);
    try {
      const newCount = uploadsCount + 1;
      setUploadsCount(newCount);
      localStorage.setItem('queryza_uploads_v1', String(newCount));
      applySession(await uploadForm(form));
    } catch (e) { alert('Upload failed: ' + e.message); }
    finally { setUploading(false); }
  };

  const sendMessage = async (text) => {
    const q = (text || input).trim();
    if (!q || !session || loading) return;

    // 5-Question Free Guest Limit Check
    if (!user && guestQueriesCount >= 5) {
      setPendingQuery(q);
      setAuthModalOpen(true);
      return;
    }

    if (!user) {
      const newCount = guestQueriesCount + 1;
      setGuestQueriesCount(newCount);
      localStorage.setItem('queryza_guest_queries_v1', String(newCount));
    }

    const currentTime = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    setInput('');
    setSidebarOpen(false);
    setMessages(prev => [...prev, { role: 'user', content: q, timestamp: currentTime }]);
    setLoading(true);
    try {
      let currentSessionId = session.session_id;
      let res = await fetch(`${API}/query`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: currentSessionId, question: q }),
      });

      // If backend restarted / session expired, attempt silent background auto-recovery
      if (res.status === 404) {
        const cachedDataUrl = localStorage.getItem('queryza_active_file_data_v1');
        const cachedFilename = localStorage.getItem('queryza_active_file_name_v1') || 'dataset.csv';
        if (cachedDataUrl) {
          try {
            const blobRes = await fetch(cachedDataUrl);
            const blob = await blobRes.blob();
            const autoFile = new File([blob], cachedFilename);
            const autoForm = new FormData();
            autoForm.append('file', autoFile);
            const newSession = await uploadForm(autoForm);
            setSession(newSession);
            localStorage.setItem('queryza_session_v1', JSON.stringify(newSession));
            currentSessionId = newSession.session_id;
            
            // Retry the question with recovered session
            res = await fetch(`${API}/query`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ session_id: currentSessionId, question: q }),
            });
          } catch (autoErr) {
            console.warn("Silent recovery failed:", autoErr);
          }
        }
      }

      const replyTime = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 404) {
          setMessages(prev => [...prev, {
            role: 'ai',
            content: 'Your dataset session has expired on the server. Please re-upload your spreadsheet below to resume analysis.',
            sessionExpired: true,
            timestamp: replyTime
          }]);
          return;
        }
        const msg = typeof data.detail === 'string' ? data.detail : 'Something went wrong. Please try again.';
        setMessages(prev => [...prev, { role: 'ai', content: msg, error: msg, timestamp: replyTime }]);
        return;
      }
      setMessages(prev => [...prev, {
        role: 'ai',
        content: data.answer || data.error || 'No response.',
        code: data.code,
        chart: data.chart,
        table: data.table,
        error: data.error,
        timestamp: replyTime
      }]);
    } catch (e) {
      const errTime = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      setMessages(prev => [...prev, { role: 'ai', content: 'Connection failed. Please verify backend is running.', error: 'Failed to fetch', timestamp: errTime }]);
    } finally { setLoading(false); }
  };

  const clearChat = () => {
    setMessages([]);
    localStorage.removeItem('queryza_messages_v1');
    if (session) fetch(`${API}/session/${session.session_id}`, { method: 'DELETE' });
  };

  const handleResetDataset = () => {
    // If guest tries to upload another file and already used 1 free dataset, prompt sign-in
    if (!user && uploadsCount >= 1) {
      setAuthModalOpen(true);
      return;
    }
    setSession(null);
    setMessages([]);
    localStorage.removeItem('queryza_session_v1');
    localStorage.removeItem('queryza_messages_v1');
  };

  const onKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  };

  const onInputChange = (e) => {
    setInput(e.target.value);
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  };

  const appendColumnToInput = (colName) => {
    setInput(prev => prev ? `${prev} '${colName}'` : `Show me data for '${colName}'`);
    if (textareaRef.current) textareaRef.current.focus();
  };

  const filteredColumns = session?.column_names?.filter(c => 
    c.toLowerCase().includes(columnFilter.toLowerCase())
  ) || [];

  return (
    <>
      {/* Auth / Sign In Modal */}
      {authModalOpen && !user && (
        <div className="modal-backdrop" onClick={() => setAuthModalOpen(false)}>
          <div className="modal-window auth-modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-head" style={{borderBottom: 'none', paddingBottom: '0'}}>
              <div />
              <button className="icon-btn" onClick={() => setAuthModalOpen(false)}>✕</button>
            </div>
            <div className="modal-body" style={{paddingTop: '0'}}>
              <div className="auth-icon-badge">
                <Icons.Sparkles />
              </div>
              <h2 style={{fontSize: '20px', fontWeight: 800, marginBottom: '6px'}}>
                Unlock Unlimited Analysis
              </h2>
              <p style={{fontSize: '13px', color: 'var(--text-secondary)', lineHeight: 1.5}}>
                {!user && guestQueriesCount >= 5 
                  ? "You've used all 5 free guest questions! Sign in with Google to continue asking unlimited questions, generating charts, and inspecting data." 
                  : uploadsCount >= 1 
                  ? "You've completed your free guest trial dataset! Sign in with Google to unlock unlimited workbook uploads and export tools." 
                  : "Sign in to Queryza Studio with your Google account to unlock full unlimited analytical features."}
              </p>

              <div className="auth-benefits">
                <div className="benefit-item">
                  <span style={{color: 'var(--accent)'}}>✓</span> Unlimited CSV & Excel workbook uploads
                </div>
                <div className="benefit-item">
                  <span style={{color: 'var(--accent)'}}>✓</span> Persistent chat history across browser tabs
                </div>
                <div className="benefit-item">
                  <span style={{color: 'var(--accent)'}}>✓</span> 1-click CSV exports & Python code inspection
                </div>
              </div>

              {/* Google Sign In Button */}
              <button className="google-signin-btn" onClick={handleGoogleSignIn}>
                <Icons.Google /> Continue with Google
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Global Feedback Modal */}
      {feedbackModalOpen && (
        <div className="modal-backdrop" onClick={() => !feedbackSent && setFeedbackModalOpen(false)}>
          <div className="modal-window auth-modal-card" onClick={e => e.stopPropagation()} style={{maxWidth: '440px'}}>
            <div className="modal-head">
              <h3 style={{display: 'flex', alignItems: 'center', gap: '6px', fontSize: '14px', fontWeight: 700}}>
                <span style={{color: 'var(--accent)'}}><Icons.MessageSquare /></span> Share Feedback & Ratings
              </h3>
              <button className="icon-btn" onClick={() => setFeedbackModalOpen(false)}>✕</button>
            </div>
            <div className="modal-body">
              {feedbackSent ? (
                <div style={{textAlign: 'center', padding: '24px 10px'}}>
                  <div style={{width: '46px', height: '46px', borderRadius: '50%', background: 'var(--accent-subtle)', color: 'var(--accent-text)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 12px', fontSize: '20px', fontWeight: 800}}>
                    ✓
                  </div>
                  <h3 style={{fontSize: '17px', fontWeight: 700, marginBottom: '6px'}}>Thank You!</h3>
                  <p style={{fontSize: '13px', color: 'var(--text-secondary)'}}>Your rating and feedback help make Queryza better for everyone.</p>
                </div>
              ) : (
                <form onSubmit={submitGlobalFeedback}>
                  <div style={{textAlign: 'center', marginBottom: '16px'}}>
                    <div style={{fontSize: '12px', color: 'var(--text-secondary)', marginBottom: '8px'}}>How would you rate your experience?</div>
                    <div style={{display: 'flex', justifyContent: 'center', gap: '8px'}}>
                      {[1, 2, 3, 4, 5].map((star) => (
                        <button 
                          type="button"
                          key={star} 
                          style={{background: 'transparent', border: 'none', cursor: 'pointer', padding: '3px', transform: feedbackStars >= star ? 'scale(1.15)' : 'scale(1)', transition: 'transform 0.15s'}}
                          onClick={() => setFeedbackStars(star)}
                          title={`${star} Star${star > 1 ? 's' : ''}`}
                        >
                          <Icons.Star filled={feedbackStars >= star} />
                        </button>
                      ))}
                    </div>
                  </div>

                  <div style={{marginBottom: '14px'}}>
                    <div style={{fontSize: '10px', fontFamily: 'var(--font-mono)', fontWeight: 600, color: 'var(--text-muted)', marginBottom: '6px', textTransform: 'uppercase'}}>CATEGORY</div>
                    <div style={{display: 'flex', gap: '6px', flexWrap: 'wrap'}}>
                      {['✨ Feature Request', '💡 General Feedback', '🐛 Bug Report', '📊 Data Quality'].map(cat => (
                        <button
                          type="button"
                          key={cat}
                          onClick={() => setFeedbackCategory(cat)}
                          style={{
                            padding: '4px 9px',
                            borderRadius: '6px',
                            border: '1px solid ' + (feedbackCategory === cat ? 'var(--accent)' : 'var(--border)'),
                            background: feedbackCategory === cat ? 'var(--accent-subtle)' : 'var(--surface)',
                            color: feedbackCategory === cat ? 'var(--accent-text)' : 'var(--text-secondary)',
                            fontSize: '11px',
                            fontWeight: feedbackCategory === cat ? 600 : 400,
                            cursor: 'pointer'
                          }}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div style={{marginBottom: '16px'}}>
                    <div style={{fontSize: '10px', fontFamily: 'var(--font-mono)', fontWeight: 600, color: 'var(--text-muted)', marginBottom: '6px', textTransform: 'uppercase'}}>COMMENTS (OPTIONAL)</div>
                    <textarea 
                      placeholder="What did you like or what should we improve?"
                      value={feedbackComment}
                      onChange={e => setFeedbackComment(e.target.value)}
                      rows={3}
                      style={{
                        width: '100%',
                        padding: '8px 10px',
                        borderRadius: '8px',
                        border: '1px solid var(--border)',
                        background: 'var(--bg)',
                        color: 'var(--text-primary)',
                        fontSize: '12.5px',
                        fontFamily: 'var(--font-sans)',
                        outline: 'none',
                        resize: 'none'
                      }}
                    />
                  </div>

                  <button 
                    type="submit"
                    className="email-submit-btn"
                    style={{width: '100%', height: '38px', borderRadius: '8px', fontWeight: 700}}
                  >
                    Submit Feedback
                  </button>
                </form>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Raw Data Preview Modal */}
      {previewModalOpen && session && (
        <div className="modal-backdrop" onClick={() => setPreviewModalOpen(false)}>
          <div className="modal-window" onClick={e => e.stopPropagation()} style={{maxWidth: '840px'}}>
            <div className="modal-head">
              <h3>Raw Data Preview (First Records)</h3>
              <button className="icon-btn" onClick={() => setPreviewModalOpen(false)}>✕</button>
            </div>
            <div className="modal-body">
              <DataTable table={{
                columns: session.column_names,
                rows: session.preview?.map(r => session.column_names.map(c => r[c])) || []
              }} />
            </div>
          </div>
        </div>
      )}

      {/* Multi-Sheet Picker Modal */}
      {sheetPicker && (
        <div className="modal-backdrop" onClick={() => !uploading && setSheetPicker(null)}>
          <div className="modal-window" onClick={e => e.stopPropagation()}>
            <div className="modal-head">
              <h3>Select a Worksheet</h3>
              <button className="icon-btn" onClick={() => setSheetPicker(null)} disabled={uploading}>✕</button>
            </div>
            <div className="modal-body">
              <p style={{marginBottom: '16px', color: 'var(--text-secondary)'}}>
                <strong>{sheetPicker.filename}</strong> contains {sheetPicker.sheets.length} sheets. Choose one to analyze:
              </p>
              <div className="sheet-options">
                {sheetPicker.sheets.map(s => (
                  <button className="sheet-option-btn" key={s} onClick={() => selectSheet(s)} disabled={uploading}>
                    <span><Icons.Sheet /> {s}</span>
                    <span>→</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <header>
        <div className="brand" onClick={handleResetDataset}>
          <div className="brand-icon"><Icons.Logo /></div>
          <div className="brand-text">
            Queryza
            <span className="brand-badge">Studio</span>
          </div>
        </div>

        <div className="header-actions">
          <div className="status-pill" title={`Backend status: ${serverStatus}`}>
            <span className={`status-dot ${serverStatus}`}></span>
            <span>
              {serverStatus === 'waking' ? 'Waking...' : 
               serverStatus === 'ready' ? 'Connected' : 
               serverStatus === 'error' ? 'Connecting...' : 'Checking...'}
            </span>
          </div>

          {/* Accent Color Picker */}
          <div className="accent-bar" title="Change accent palette">
            <button className={`swatch-btn swatch-emerald ${accent === 'emerald' ? 'active' : ''}`} onClick={() => setAccent('emerald')} title="Cyber Jade (Default)" />
            <button className={`swatch-btn swatch-iris ${accent === 'iris' ? 'active' : ''}`} onClick={() => setAccent('iris')} title="Linear Iris" />
            <button className={`swatch-btn swatch-cyan ${accent === 'cyan' ? 'active' : ''}`} onClick={() => setAccent('cyan')} title="Electric Cyan" />
            <button className={`swatch-btn swatch-amber ${accent === 'amber' ? 'active' : ''}`} onClick={() => setAccent('amber')} title="Anthropic Amber" />
            <button className={`swatch-btn swatch-cobalt ${accent === 'cobalt' ? 'active' : ''}`} onClick={() => setAccent('cobalt')} title="Modern Cobalt" />
          </div>

          {session && (
            <button className="header-btn" onClick={() => setPreviewModalOpen(true)} title="View top rows of dataset">
              <Icons.Eye /><span className="btn-text"> Preview</span>
            </button>
          )}

          {session && (
            <button className="header-btn" onClick={exportExecutiveReport} title="Print or export executive analysis report">
              <Icons.FileText /><span className="btn-text"> Report</span>
            </button>
          )}

          <button className="header-btn" onClick={() => setFeedbackModalOpen(true)} title="Give feedback">
            <Icons.MessageSquare /><span className="btn-text"> Feedback</span>
          </button>

          {session && (
            <button className="icon-btn" onClick={clearChat} title="Clear conversation history">
              <Icons.Trash />
            </button>
          )}

          <button className="icon-btn" onClick={toggleTheme} title="Toggle Dark/Light theme">
            {theme === 'dark' ? <Icons.Sun /> : <Icons.Moon />}
          </button>

          <button className="icon-btn" onClick={handleRefresh} title="Reload page">
            <Icons.Reload />
          </button>

          {/* Auth Button / Profile Menu */}
          {!user ? (
            <button className="header-btn auth-btn-header" onClick={() => setAuthModalOpen(true)}>
              <Icons.Google /> <span className="btn-text">Sign in</span>
            </button>
          ) : (
            <div className="user-profile-menu">
              <div className="user-pill" onClick={() => setUserMenuOpen(!userMenuOpen)}>
                {user.avatar ? (
                  <img src={user.avatar} className="user-avatar-img" alt="avatar" />
                ) : (
                  <div className="user-avatar-initial">
                    {user.name?.charAt(0) || user.email?.charAt(0) || 'U'}
                  </div>
                )}
                <span className="user-email-text">{user.name || user.email}</span>
              </div>

              {userMenuOpen && (
                <div className="user-dropdown">
                  <div className="dropdown-user-info">
                    <div className="dropdown-user-name">{user.name}</div>
                    <div className="dropdown-user-email">{user.email}</div>
                    <span className="pro-badge">PRO · UNLIMITED</span>
                  </div>
                  <button className="dropdown-signout-btn" style={{marginBottom: '4px'}} onClick={() => { setUserMenuOpen(false); setFeedbackModalOpen(true); }}>
                    💬 Send Feedback
                  </button>
                  <button className="dropdown-signout-btn" onClick={handleSignOut}>
                    Sign out
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      </header>

      {/* Mobile Drawer Toggle Bar */}
      {session && (
        <div className="mobile-sidebar-toggle" onClick={() => setSidebarOpen(!sidebarOpen)}>
          <span style={{display: 'flex', alignItems: 'center', gap: '6px'}}>
            <Icons.Sheet /> {sidebarOpen ? 'Close Inspector' : 'Dataset Schema & Inquiries'}
          </span>
          <span style={{color: 'var(--accent-text)', fontSize: '11px', maxWidth: '140px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>
            {session.filename}
          </span>
        </div>
      )}

      {/* Mobile Sidebar Backdrop */}
      {sidebarOpen && (
        <div className="sidebar-backdrop" onClick={() => setSidebarOpen(false)} />
      )}

      {/* Main Workspace */}
      <div className="app-workspace">
        {/* Sidebar */}
        <aside className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
          <div className="sidebar-top">
            <div className="sidebar-mobile-header">
              <h4>Dataset Inspector</h4>
              <button className="icon-btn" style={{width: '28px', height: '28px'}} onClick={() => setSidebarOpen(false)}>✕</button>
            </div>

            <div className="sidebar-section">
              <div className="section-title">DATASET</div>
              {!session ? (
                <div 
                  className={`file-dropzone ${dragOver ? 'drag-active' : ''}`}
                  onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                  onDragLeave={() => setDragOver(false)}
                  onDrop={e => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
                >
                  <input type="file" accept=".csv,.xlsx,.xls" onChange={e => handleFile(e.target.files[0])} />
                  <div className="dropzone-icon"><Icons.Upload /></div>
                  <div className="dropzone-title">{uploading ? 'Processing dataset...' : 'Upload Data'}</div>
                  <div className="dropzone-meta">CSV, XLSX, XLS · Max 25 MB</div>
                </div>
              ) : (
                <div className="dataset-card">
                  <div className="dataset-header">
                    <div className="dataset-icon"><Icons.Sheet /></div>
                    <div className="dataset-filename" title={session.filename}>{session.filename}</div>
                  </div>
                  <div className="dataset-stats">
                    <span className="stat-badge">{session.rows.toLocaleString()} rows</span>
                    <span className="stat-badge">{session.columns} columns</span>
                  </div>
                  <div className="dataset-switch-btn" onClick={handleResetDataset}>
                    + Upload another file
                  </div>
                </div>
              )}
            </div>

            {session && (
              <div className="sidebar-section">
                <div className="section-title">
                  <span>SCHEMA · {filteredColumns.length}</span>
                </div>
                <div className="column-search">
                  <span className="column-search-icon"><Icons.Search /></span>
                  <input 
                    type="text" 
                    placeholder="Search columns..." 
                    value={columnFilter}
                    onChange={e => setColumnFilter(e.target.value)}
                  />
                </div>
                <div className="column-list">
                  {filteredColumns.map(col => {
                    const previewVals = session.preview ? session.preview.map(r => r[col]).filter(v => v !== null && v !== undefined && v !== '') : [];
                    const isNumeric = previewVals.length > 0 && previewVals.every(v => !isNaN(Number(v)));
                    let tooltip = `${col} (${isNumeric ? 'NUMBER' : 'TEXT'}) · Click to insert into query`;
                    if (isNumeric && previewVals.length > 0) {
                      const numVals = previewVals.map(Number);
                      const min = Math.min(...numVals);
                      const max = Math.max(...numVals);
                      const avg = (numVals.reduce((a, b) => a + b, 0) / numVals.length).toFixed(1);
                      tooltip = `${col} (NUMBER) · Min: ${min} · Max: ${max} · Avg: ${avg}`;
                    }

                    return (
                      <div 
                        className="column-row" 
                        key={col}
                        onClick={() => appendColumnToInput(col)}
                        title={tooltip}
                      >
                        <div className="column-name-box">
                          <span className="column-type-icon" style={{color: isNumeric ? '#a78bfa' : '#00e5c3'}}>
                            {isNumeric ? '#' : 'T'}
                          </span>
                          <span className="column-name">{col}</span>
                        </div>
                        <span className={`col-type-tag ${isNumeric ? 'tag-num' : 'tag-txt'}`}>
                          {isNumeric ? 'NUMBER' : 'TEXT'}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {session && session.suggestions && session.suggestions.length > 0 && (
              <div className="sidebar-section">
                <div className="section-title">SUGGESTED QUESTIONS</div>
                <div className="prompts-list">
                  {session.suggestions.map((s, i) => {
                    const icons = ['✦', '⌁', '◫', '↗', '▥', '📈'];
                    const icon = icons[i % icons.length];
                    return (
                      <button className="prompt-chip" key={i} onClick={() => sendMessage(s)}>
                        <span style={{display: 'flex', alignItems: 'center'}}>
                          <span className="prompt-action-icon">{icon}</span>
                          <span>{s}</span>
                        </span>
                        <span style={{color: 'var(--text-muted)', fontSize: '11px'}}>→</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </div>

          {/* Sidebar Bottom Guest Auth Banner */}
          {!user && (
            <div className="sidebar-auth-card">
              <div className="sidebar-auth-title">
                <span style={{color: 'var(--accent)'}}><Icons.Sparkles /></span> Unlock Unlimited Access
              </div>
              <div className="sidebar-auth-desc">
                Sign in with Google to ask unlimited questions, inspect Python code, and export reports.
              </div>
              <button className="sidebar-auth-btn" onClick={() => setAuthModalOpen(true)}>
                <Icons.Google /> Sign in with Google
              </button>
            </div>
          )}
        </aside>

        {/* Chat / Analysis Canvas */}
        <main className="chat-workspace">
          {!session ? (
            <div className="hero-container">
              <div className="hero-badge">
                <Icons.Logo /> Intelligent Analytical Studio
              </div>
              <h1 className="hero-title">
                Ask your data <br /><span>anything in plain English</span>
              </h1>
              <p className="hero-desc">
                Upload your CSV or Excel workbook. Queryza executes Python analysis, computes metrics, and renders interactive Plotly visualizations automatically.
              </p>

              <div 
                className={`hero-upload-card ${dragOver ? 'drag-active' : ''}`}
                onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                onDragLeave={() => setDragOver(false)}
                onDrop={e => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
              >
                <input type="file" accept=".csv,.xlsx,.xls" onChange={e => handleFile(e.target.files[0])} />
                <div className="hero-upload-icon"><Icons.Upload /></div>
                <div style={{fontWeight: 700, fontSize: '15px', marginBottom: '4px'}}>
                  {uploading ? 'Analyzing dataset schema...' : 'Drop your spreadsheet here or click to browse'}
                </div>
                <div style={{fontSize: '12px', color: 'var(--text-muted)'}}>
                  Supports CSV, XLSX, XLS up to 100,000 rows
                </div>
              </div>

              {/* 1-Click Sample Datasets */}
              <div className="sample-datasets-section">
                <div className="sample-datasets-label">OR EXPLORE A 1-CLICK SAMPLE DATASET:</div>
                <div className="sample-grid">
                  {SAMPLE_DATASETS.map((sample) => (
                    <div className="sample-card" key={sample.name} onClick={() => loadSampleDataset(sample)}>
                      <div className="sample-icon">{sample.name.split(' ')[0]}</div>
                      <div className="sample-title">{sample.name.slice(3)}</div>
                      <div className="sample-desc">{sample.desc}</div>
                      <div className="sample-meta">{sample.rows} · {sample.cols}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          ) : (
            <>
              <div className="messages-stream" ref={messagesStreamRef}>
                {messages.length === 0 && (
                  <div style={{textAlign: 'center', color: 'var(--text-muted)', padding: '40px 0', fontSize: '13px'}}>
                    Dataset loaded. Ask a question below or choose a suggested inquiry.
                  </div>
                )}

                {messages.map((msg, i) => (
                  <div className={`msg-row ${msg.role}`} key={i}>
                    {msg.role === 'ai' && (
                      <div className="msg-avatar ai"><Icons.Logo /></div>
                    )}
                    {msg.role === 'user' ? (
                      <div style={{display: 'flex', alignItems: 'flex-end', gap: '8px', justifyContent: 'flex-end', width: '100%'}}>
                        <div className="msg-bubble-user">
                          <div>{msg.content}</div>
                          <div className="msg-user-meta">
                            <span>{msg.timestamp || new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span>
                            <span style={{color: 'var(--accent)'}}>✓✓</span>
                          </div>
                        </div>
                        <div className="msg-avatar user">
                          {user?.avatar ? (
                            <img src={user.avatar} style={{width: '100%', height: '100%', borderRadius: '50%'}} alt="u" />
                          ) : (
                            <span>{user?.name?.charAt(0) || 'U'}</span>
                          )}
                        </div>
                      </div>
                    ) : (
                      <StudioResultCard msg={msg} theme={theme} accent={accent} onReupload={handleFile} />
                    )}
                  </div>
                ))}

                {loading && (
                  <div className="msg-row ai">
                    <div className="msg-avatar ai"><Icons.Logo /></div>
                    <div className="msg-card-ai" style={{padding: '14px 18px', maxWidth: '240px'}}>
                      <div style={{fontSize: '12px', fontWeight: 600, color: 'var(--accent-text)', marginBottom: '4px', display: 'flex', alignItems: 'center', gap: '6px'}}>
                        <Icons.Sparkles /> Analyzing your dataset...
                      </div>
                      <div className="typing-box">
                        <div className="typing-dot" />
                        <div className="typing-dot" />
                        <div className="typing-dot" />
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* Floating Input Dock */}
              <div className="input-dock">
                {!user && (
                  <div style={{display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '6px', fontSize: '11px', color: 'var(--text-muted)', marginBottom: '8px', flexWrap: 'wrap'}}>
                    <span>⚡ Guest Trial: <strong style={{color: 'var(--text-primary)'}}>{Math.max(0, 5 - guestQueriesCount)} of 5</strong> free questions remaining</span>
                    <span>·</span>
                    <span style={{color: 'var(--accent-text)', cursor: 'pointer', fontWeight: 600, textDecoration: 'underline'}} onClick={() => setAuthModalOpen(true)}>Sign in with Google for unlimited</span>
                  </div>
                )}
                <div className="input-box">
                  <label className="input-tool-btn" title="Upload or switch spreadsheet">
                    <Icons.Upload />
                    <input type="file" accept=".csv,.xlsx,.xls" style={{display: 'none'}} onChange={e => handleFile(e.target.files[0])} />
                  </label>
                  <textarea
                    ref={textareaRef}
                    rows={1}
                    placeholder="Ask Queryza anything about your data..."
                    value={input}
                    onChange={onInputChange}
                    onKeyDown={onKeyDown}
                    disabled={loading}
                  />
                  <button 
                    className="send-btn" 
                    onClick={() => sendMessage()} 
                    disabled={loading || !input.trim()}
                    title="Send inquiry"
                  >
                    <Icons.Send />
                  </button>
                </div>
                <div className="input-shortcuts">
                  Press ↵ Enter to send · ⇧ Shift+Enter for new line
                </div>
              </div>
            </>
          )}
        </main>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
