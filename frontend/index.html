<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="emerald">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Queryza — Conversational Data Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ---- DARK THEME BASE ---- */
    [data-theme="dark"] {
      --bg: #07090e;
      --bg-subtle: #0c1017;
      --surface: #111622;
      --surface-hover: #171e2e;
      --surface-active: #1d263b;
      --surface-elevated: #141b29;
      --border: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.04);
      --border-hover: rgba(255, 255, 255, 0.16);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --emerald: #10b981;
      --emerald-subtle: rgba(16, 185, 129, 0.12);
      --amber: #f59e0b;
      --amber-subtle: rgba(245, 158, 11, 0.12);
      --rose: #f43f5e;
      --rose-subtle: rgba(244, 63, 94, 0.12);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
      --glass-bg: rgba(17, 22, 34, 0.85);
      --table-stripe: rgba(255, 255, 255, 0.02);
    }

    /* ---- LIGHT THEME BASE ---- */
    [data-theme="light"] {
      --bg: #f8fafc;
      --bg-subtle: #f1f5f9;
      --surface: #ffffff;
      --surface-hover: #f8fafc;
      --surface-active: #f1f5f9;
      --surface-elevated: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.04);
      --border-hover: rgba(0, 0, 0, 0.15);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --emerald: #059669;
      --emerald-subtle: rgba(5, 150, 105, 0.08);
      --amber: #d97706;
      --amber-subtle: rgba(217, 119, 6, 0.08);
      --rose: #e11d48;
      --rose-subtle: rgba(225, 29, 72, 0.08);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
      --glass-bg: rgba(255, 255, 255, 0.85);
      --table-stripe: rgba(0, 0, 0, 0.015);
    }

    /* ---- ACCENT PALETTES ---- */
    [data-accent="emerald"][data-theme="dark"], [data-accent="emerald"] {
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-subtle: rgba(16, 185, 129, 0.15);
      --accent-text: #34d399;
      --brand-grad: linear-gradient(135deg, #10b981, #06b6d4);
      --chart-p1: #10b981;
      --chart-p2: #06b6d4;
    }
    [data-accent="emerald"][data-theme="light"] {
      --accent: #059669;
      --accent-hover: #047857;
      --accent-subtle: rgba(5, 150, 105, 0.1);
      --accent-text: #059669;
      --brand-grad: linear-gradient(135deg, #059669, #0891b2);
      --chart-p1: #059669;
      --chart-p2: #0891b2;
    }

    [data-accent="iris"][data-theme="dark"] {
      --accent: #5e6ad2;
      --accent-hover: #4f46e5;
      --accent-subtle: rgba(94, 106, 210, 0.15);
      --accent-text: #818cf8;
      --brand-grad: linear-gradient(135deg, #5e6ad2, #a855f7);
      --chart-p1: #5e6ad2;
      --chart-p2: #a855f7;
    }
    [data-accent="iris"][data-theme="light"] {
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-subtle: rgba(79, 70, 229, 0.1);
      --accent-text: #4f46e5;
      --brand-grad: linear-gradient(135deg, #4f46e5, #9333ea);
      --chart-p1: #4f46e5;
      --chart-p2: #9333ea;
    }

    [data-accent="cyan"][data-theme="dark"] {
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --accent-subtle: rgba(6, 182, 212, 0.15);
      --accent-text: #38bdf8;
      --brand-grad: linear-gradient(135deg, #06b6d4, #3b82f6);
      --chart-p1: #06b6d4;
      --chart-p2: #3b82f6;
    }
    [data-accent="cyan"][data-theme="light"] {
      --accent: #0891b2;
      --accent-hover: #0e7490;
      --accent-subtle: rgba(8, 145, 178, 0.1);
      --accent-text: #0891b2;
      --brand-grad: linear-gradient(135deg, #0891b2, #2563eb);
      --chart-p1: #0891b2;
      --chart-p2: #2563eb;
    }

    [data-accent="amber"][data-theme="dark"] {
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --accent-subtle: rgba(245, 158, 11, 0.15);
      --accent-text: #fbbf24;
      --brand-grad: linear-gradient(135deg, #f59e0b, #ef4444);
      --chart-p1: #f59e0b;
      --chart-p2: #f43f5e;
    }
    [data-accent="amber"][data-theme="light"] {
      --accent: #d97706;
      --accent-hover: #b45309;
      --accent-subtle: rgba(217, 119, 6, 0.1);
      --accent-text: #d97706;
      --brand-grad: linear-gradient(135deg, #d97706, #dc2626);
      --chart-p1: #d97706;
      --chart-p2: #dc2626;
    }

    [data-accent="cobalt"][data-theme="dark"] {
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-subtle: rgba(59, 130, 246, 0.15);
      --accent-text: #60a5fa;
      --brand-grad: linear-gradient(135deg, #3b82f6, #06b6d4);
      --chart-p1: #3b82f6;
      --chart-p2: #06b6d4;
    }
    [data-accent="cobalt"][data-theme="light"] {
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-subtle: rgba(37, 99, 235, 0.1);
      --accent-text: #2563eb;
      --brand-grad: linear-gradient(135deg, #2563eb, #0891b2);
      --chart-p1: #2563eb;
      --chart-p2: #0891b2;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      transition: background var(--transition), color var(--transition);
    }

    #root {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- SCROLLBARS ---- */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

    /* ---- HEADER ---- */
    header {
      height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 50;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
      cursor: pointer;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--brand-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .brand-text {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-subtle);
      color: var(--accent-text);
      letter-spacing: 0.2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.ready { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }
    .status-dot.waking { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: pulse 1.4s infinite; }
    .status-dot.error { background: var(--rose); box-shadow: 0 0 6px var(--rose); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .icon-btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .header-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .header-btn:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    /* Accent Swatches */
    .accent-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 6px;
      flex-shrink: 0;
    }
    .swatch-btn {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
      position: relative;
    }
    .swatch-btn:hover { transform: scale(1.2); }
    .swatch-btn.active {
      box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent);
      transform: scale(1.15);
    }
    .swatch-emerald { background: #10b981; }
    .swatch-iris { background: #5e6ad2; }
    .swatch-cyan { background: #06b6d4; }
    .swatch-amber { background: #f59e0b; }
    .swatch-cobalt { background: #3b82f6; }

    /* ---- MAIN LAYOUT ---- */
    .app-workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      overflow: hidden;
      min-height: 0;
      height: calc(100vh - 56px);
      position: relative;
    }

    /* ---- SIDEBAR / DATASET NAVIGATOR ---- */
    .sidebar {
      background: var(--bg-subtle);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      height: 100%;
      min-height: 0;
    }

    .sidebar-mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .sidebar-mobile-header h4 {
      font-size: 13px;
      font-weight: 700;
    }

    .sidebar-section {
      padding: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* File Drop Card in Sidebar */
    .file-dropzone {
      border: 1.5px dashed var(--border-hover);
      background: var(--surface);
      border-radius: 10px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }
    .file-dropzone:hover, .file-dropzone.drag-active {
      border-color: var(--accent);
      background: var(--accent-subtle);
    }
    .file-dropzone input {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .dropzone-icon {
      width: 36px;
      height: 36px;
      margin: 0 auto 10px;
      border-radius: 8px;
      background: var(--accent-subtle);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dropzone-title {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .dropzone-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Loaded Dataset Card */
    .dataset-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }
    .dataset-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .dataset-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--accent-subtle);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .dataset-filename {
      font-weight: 600;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .dataset-stats {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .stat-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .dataset-switch-btn {
      font-size: 11px;
      color: var(--accent-text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      transition: color var(--transition);
    }
    .dataset-switch-btn:hover {
      text-decoration: underline;
    }

    /* Column Schema Explorer */
    .column-search {
      margin-bottom: 8px;
      position: relative;
    }
    .column-search input {
      width: 100%;
      height: 28px;
      padding: 0 8px 0 26px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      font-size: 11px;
      font-family: var(--font-sans);
      outline: none;
    }
    .column-search input:focus {
      border-color: var(--accent);
    }
    .column-search-icon {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .column-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 280px;
      overflow-y: auto;
    }
    .column-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      font-size: 12px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .column-row:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }
    .column-name {
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 6px;
    }
    .col-type-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .tag-num { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .tag-txt { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }
    .tag-date { background: rgba(16, 185, 129, 0.15); color: #34d399; }

    /* Suggested Questions */
    .prompts-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .prompt-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text-secondary);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: all var(--transition);
    }
    .prompt-chip:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--text-primary);
      transform: translateX(2px);
    }
    .prompt-arrow {
      color: var(--text-muted);
      font-size: 11px;
      transition: transform var(--transition);
    }
    .prompt-chip:hover .prompt-arrow {
      color: var(--accent);
      transform: translateX(2px);
    }

    /* ---- MAIN CHAT / STUDIO AREA ---- */
    .chat-workspace {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }

    .messages-stream {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ---- EMPTY STATE ---- */
    .hero-container {
      margin: auto;
      max-width: 580px;
      width: 100%;
      padding: 40px 20px;
      text-align: center;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .hero-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    .hero-title span {
      background: var(--brand-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 28px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-upload-card {
      border: 1.5px dashed var(--border-hover);
      border-radius: 12px;
      background: var(--surface);
      padding: 36px 20px;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      margin-bottom: 24px;
    }
    .hero-upload-card:hover, .hero-upload-card.drag-active {
      border-color: var(--accent);
      background: var(--accent-subtle);
    }
    .hero-upload-card input {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .hero-upload-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-subtle);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }

    /* ---- MESSAGE CARDS ---- */
    .msg-row {
      display: flex;
      gap: 12px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      word-break: break-word;
    }
    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
    }
    .msg-avatar.ai {
      background: var(--brand-grad);
      color: #ffffff;
    }
    .msg-avatar.user {
      background: var(--surface-hover);
      color: var(--text-secondary);

/* ---- PLOTLY WRAPPER ---- */
function PlotlyChart({ data, theme, accent }) {
  const ref = useRef();
  useEffect(() => {
    const el = ref.current;
    if (!el || !data) return;
    const isDark = theme === 'dark';
    const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--chart-p1').trim() || '#10b981';
    const secondaryColor = getComputedStyle(document.documentElement).getPropertyValue('--chart-p2').trim() || '#06b6d4';

    const traces = Array.isArray(data.data) ? data.data : [];
    const coloredData = traces.map((trace, idx) => ({
      ...trace,
      marker: { ...((trace.marker) || {}), color: trace.marker?.color || (idx === 0 ? primaryColor : secondaryColor) },
      line: { ...((trace.line) || {}), color: trace.line?.color || (idx === 0 ? primaryColor : secondaryColor) }
    }));
    try {
      Plotly.newPlot(el, coloredData, {
        ...(data.layout || {}),
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        font: { family: 'Plus Jakarta Sans, sans-serif', color: isDark ? '#94a3b8' : '#475569', size: 11 },
        margin: { t: 25, r: 15, b: 35, l: 45 },
        colorway: [primaryColor, secondaryColor, '#3b82f6', '#f59e0b', '#f43f5e', '#8b5cf6'],
        xaxis: { gridcolor: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)', zerolinecolor: isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)' },
        yaxis: { gridcolor: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)', zerolinecolor: isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)' },
      }, { responsive: true, displayModeBar: false });
    } catch (err) {
      console.warn("Plotly error:", err);
    }
    return () => {
      if (el) {
        try { Plotly.purge(el); } catch (e) {}
      }
    };
  }, [data, theme, accent]);
  return <div ref={ref} className="chart-container" />;
}

/* ---- DATA TABLE VIEW ---- */
function DataTable({ table }) {
  if (!table || !table.columns) return null;
  return (
    <div className="table-container">
      <table>
        <thead>
          <tr>{table.columns.map((c, i) => <th key={i}>{c}</th>)}</tr>
        </thead>
        <tbody>
          {table.rows.map((row, i) => (
            <tr key={i}>
              {row.map((cell, j) => <td key={j}>{String(cell ?? '')}</td>)}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

/* ---- STUDIO CARD (TABBED RESULT) ---- */
function StudioResultCard({ msg, theme, accent, onReupload }) {
  const [activeTab, setActiveTab] = useState(msg.chart ? 'chart' : msg.table ? 'table' : 'code');
  const [copiedCode, setCopiedCode] = useState(false);

  const copyCode = () => {
    if (!msg.code) return;
    navigator.clipboard.writeText(msg.code);
    setCopiedCode(true);
    setTimeout(() => setCopiedCode(false), 2000);
  };

  const exportTableCSV = () => {
    if (!msg.table) return;
    const header = msg.table.columns.join(',');
    const rows = msg.table.rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(','));
    const csvContent = "data:text/csv;charset=utf-8," + [header, ...rows].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "queryza_export.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  return (
    <div className="msg-card-ai">
      <div className="ai-header-bar">
        <div className="ai-label">
          <span style={{color: 'var(--accent)'}}><Icons.Logo /></span>

        <div className="ai-actions">
          {msg.table && (
            <button className="tool-btn" onClick={exportTableCSV} title="Export data to CSV">
              <Icons.Download /> CSV
            </button>
          )}
          {msg.code && (
            <button className="tool-btn" onClick={copyCode} title="Copy generated Python code">
              {copiedCode ? <Icons.Check /> : <Icons.Copy />} {copiedCode ? 'Copied' : 'Code'}

        </div>
      </div>

      <div className="ai-explanation">
        {msg.content}
      </div>

      {(msg.chart || msg.table || msg.code) && (
        <div className="studio-card">
          <div className="studio-tabs">
            {msg.chart && (
              <button className={`tab-btn ${activeTab === 'chart' ? 'active' : ''}`} onClick={() => setActiveTab('chart')}>
                <Icons.Chart /> Visualization
              </button>
            )}
            {msg.table && (
              <button className={`tab-btn ${activeTab === 'table' ? 'active' : ''}`} onClick={() => setActiveTab('table')}>
                <Icons.Table /> Data Table ({msg.table.rows.length})
              </button>
            )}
            {msg.code && (
              <button className={`tab-btn ${activeTab === 'code' ? 'active' : ''}`} onClick={() => setActiveTab('code')}>
                <Icons.Code /> Python Code
              </button>
            )}
          </div>

          <div className="studio-content">
            {activeTab === 'chart' && msg.chart && <PlotlyChart data={msg.chart} theme={theme} accent={accent} />}
            {activeTab === 'table' && msg.table && <DataTable table={msg.table} />}
            {activeTab === 'code' && msg.code && <pre className="code-viewer">{msg.code}</pre>}
          </div>
        </div>
      )}

      {msg.error && (
        <div style={{color: 'var(--rose)', fontSize: '12px', background: 'var(--rose-subtle)', padding: '8px 12px', borderRadius: '6px', marginTop: '4px'}}>
          {msg.error}
        </div>
      )}

      {msg.sessionExpired && onReupload && (
        <div style={{marginTop: '8px', display: 'flex', gap: '8px'}}>
          <label className="header-btn" style={{cursor: 'pointer', background: 'var(--accent)', color: '#ffffff', border: 'none', padding: '6px 14px'}}>
            <Icons.Upload /> Re-upload Spreadsheet
            <input type="file" accept=".csv,.xlsx,.xls" style={{display: 'none'}} onChange={e => onReupload(e.target.files[0])} />
          </label>
        </div>
      )}
    </div>
  );
}

/* ---- MAIN APP COMPONENT ---- */
function App() {
  const [session, setSession] = useState(() => {
    try {
      const saved = localStorage.getItem('queryza_session_v1');
      return saved ? JSON.parse(saved) : null;
    } catch { return null; }
  });

  const [messages, setMessages] = useState(() => {
    try {
      const saved = localStorage.getItem('queryza_messages_v1');
      return saved ? JSON.parse(saved) : [];
    } catch { return []; }
  });

  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('queryza_theme_v1') || 'dark'; } catch { return 'dark'; }
  });

  const [accent, setAccent] = useState(() => {
    try { return localStorage.getItem('queryza_accent_v1') || 'emerald'; } catch { return 'emerald'; }
  });

  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [sheetPicker, setSheetPicker] = useState(null);
  const [previewModalOpen, setPreviewModalOpen] = useState(false);
  const [columnFilter, setColumnFilter] = useState('');
  const [serverStatus, setServerStatus] = useState('checking');

  const messagesStreamRef = useRef();
  const textareaRef = useRef();

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('queryza_theme_v1', theme); } catch (e) {}
  }, [theme]);

  useEffect(() => {
    document.documentElement.setAttribute('data-accent', accent);
    try { localStorage.setItem('queryza_accent_v1', accent); } catch (e) {}
  }, [accent]);

  useEffect(() => {
    try {
      if (session) {
        localStorage.setItem('queryza_session_v1', JSON.stringify(session));
      } else {
        localStorage.removeItem('queryza_session_v1');
      }
    } catch (e) {}
  }, [session]);

  useEffect(() => {
    try {
      if (messages && messages.length > 0) {
        localStorage.setItem('queryza_messages_v1', JSON.stringify(messages));
      } else {
        localStorage.removeItem('queryza_messages_v1');
      }
    } catch (e) {}
  }, [messages]);

  const scrollToBottom = () => {
    if (messagesStreamRef.current) {
      messagesStreamRef.current.scrollTop = messagesStreamRef.current.scrollHeight;
    }
  };

  useEffect(() => {
    scrollToBottom();
  }, [messages.length, loading]);

  useEffect(() => {
    let isMounted = true;
    const timer = setTimeout(() => {
      if (isMounted) setServerStatus(s => s === 'ready' ? 'ready' : 'waking');
    }, 1200);

    const checkHealth = async () => {
      try {
        const res = await fetch(`${API}/health`, { cache: 'no-store' });
        if (res.ok && isMounted) setServerStatus('ready');
        else if (isMounted) setServerStatus('error');
      } catch (e) {
        if (isMounted) setServerStatus('error');
      } finally {
        clearTimeout(timer);
      }
    };
    checkHealth();
    return () => { isMounted = false; clearTimeout(timer); };
  }, []);

  const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

  const applySession = (data) => {
    setSession(data);
    setMessages([]);
    localStorage.setItem('queryza_session_v1', JSON.stringify(data));
    localStorage.removeItem('queryza_messages_v1');
    setSidebarOpen(false);
    setSheetPicker(null);
    setServerStatus('ready');
  };

  const uploadForm = async (form) => {
    const res = await fetch(`${API}/upload`, { method: 'POST', body: form });
    let body;
    try { body = await res.json(); } catch { body = {}; }
    if (!res.ok) {
      const detail = body.detail;
      throw new Error(typeof detail === 'string' ? detail : 'Upload failed');
    }
    return body;
  };

  const handleFile = async (file) => {
    if (!file) return;
    setUploading(true);
    const form = new FormData();
    form.append('file', file);
    try {
      const data = await uploadForm(form);
      if (data.needs_sheet) {
        setSheetPicker({ file, sheets: data.sheets, filename: data.filename });
        return;
      }
      applySession(data);
    } catch (e) { alert('Upload failed: ' + e.message); }
    finally { setUploading(false); }
  };

  const selectSheet = async (sheet) => {
    if (!sheetPicker?.file) return;
    setUploading(true);
    const form = new FormData();
    form.append('file', sheetPicker.file);
    form.append('sheet', sheet);
    try {
      applySession(await uploadForm(form));
    } catch (e) { alert('Upload failed: ' + e.message); }
    finally { setUploading(false); }
  };

  const sendMessage = async (text) => {
    const q = (text || input).trim();
    if (!q || !session || loading) return;
    setInput('');
    setSidebarOpen(false);
    setMessages(prev => [...prev, { role: 'user', content: q }]);
    setLoading(true);
    try {
      const res = await fetch(`${API}/query`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: session.session_id, question: q }),
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 404) {
          setMessages(prev => [...prev, {
            role: 'ai',
            content: 'Your dataset session has expired on the server. Please re-upload your spreadsheet below to resume analysis.',
            sessionExpired: true
          }]);
          return;
        }
        const msg = typeof data.detail === 'string' ? data.detail : 'Something went wrong. Please try again.';
        setMessages(prev => [...prev, { role: 'ai', content: msg, error: msg }]);
        return;
      }
      setMessages(prev => [...prev, {
        role: 'ai',
        content: data.answer || data.error || 'No response.',
        code: data.code,
        chart: data.chart,
        table: data.table,
        error: data.error,
      }]);
    } catch (e) {
      setMessages(prev => [...prev, { role: 'ai', content: 'Connection failed. Please verify backend is running.', error: 'Failed to fetch' }]);
    } finally { setLoading(false); }
  };

  const clearChat = () => {
    setMessages([]);
    localStorage.removeItem('queryza_messages_v1');
    if (session) fetch(`${API}/session/${session.session_id}`, { method: 'DELETE' });
  };

  const handleResetDataset = () => {
    setSession(null);
    setMessages([]);
    localStorage.removeItem('queryza_session_v1');
    localStorage.removeItem('queryza_messages_v1');
  };

  const onKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  };

  const onInputChange = (e) => {
    setInput(e.target.value);
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  };

  const appendColumnToInput = (colName) => {
    setInput(prev => prev ? `${prev} '${colName}'` : `Show me data for '${colName}'`);
    if (textareaRef.current) textareaRef.current.focus();
  };

  const filteredColumns = session?.column_names?.filter(c => 
    c.toLowerCase().includes(columnFilter.toLowerCase())
  ) || [];

  return (
    <>
      {/* Raw Data Preview Modal */}
      {previewModalOpen && session && (
        <div className="modal-backdrop" onClick={() => setPreviewModalOpen(false)}>
          <div className="modal-window" onClick={e => e.stopPropagation()} style={{maxWidth: '840px'}}>
            <div className="modal-head">
              <h3>Raw Data Preview (First Records)</h3>
              <button className="icon-btn" onClick={() => setPreviewModalOpen(false)}>✕</button>
            </div>
            <div className="modal-body">
              <DataTable table={{
                columns: session.column_names,
                rows: session.preview?.map(r => session.column_names.map(c => r[c])) || []
              }} />
            </div>
          </div>
        </div>
      )}

      {/* Multi-Sheet Picker Modal */}
      {sheetPicker && (
        <div className="modal-backdrop" onClick={() => !uploading && setSheetPicker(null)}>
          <div className="modal-window" onClick={e => e.stopPropagation()}>
            <div className="modal-head">
              <h3>Select a Worksheet</h3>
              <button className="icon-btn" onClick={() => setSheetPicker(null)} disabled={uploading}>✕</button>
            </div>
            <div className="modal-body">
              <p style={{marginBottom: '16px', color: 'var(--text-secondary)'}}>
                <strong>{sheetPicker.filename}</strong> contains {sheetPicker.sheets.length} sheets. Choose one to analyze:
              </p>
              <div className="sheet-options">
                {sheetPicker.sheets.map(s => (
                  <button className="sheet-option-btn" key={s} onClick={() => selectSheet(s)} disabled={uploading}>
                    <span><Icons.Sheet /> {s}</span>
                    <span>→</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <header>
        <div className="brand" onClick={handleResetDataset}>
          <div className="brand-icon"><Icons.Logo /></div>
          <div className="brand-text">
            Queryza
            <span className="brand-badge">STUDIO</span>
          </div>
        </div>

        <div className="header-actions">
          <div className="status-pill" title={`Backend status: ${serverStatus}`}>
            <span className={`status-dot ${serverStatus}`}></span>
            <span>
              {serverStatus === 'waking' ? 'Waking...' : 
               serverStatus === 'ready' ? 'Connected' : 
               serverStatus === 'error' ? 'Connecting...' : 'Checking...'}
            </span>
          </div>

          {/* Accent Color Picker */}
          <div className="accent-bar" title="Change accent palette">
            <button className={`swatch-btn swatch-emerald ${accent === 'emerald' ? 'active' : ''}`} onClick={() => setAccent('emerald')} title="Cyber Jade (Default)" />
            <button className={`swatch-btn swatch-iris ${accent === 'iris' ? 'active' : ''}`} onClick={() => setAccent('iris')} title="Linear Iris" />
            <button className={`swatch-btn swatch-cyan ${accent === 'cyan' ? 'active' : ''}`} onClick={() => setAccent('cyan')} title="Electric Cyan" />
            <button className={`swatch-btn swatch-amber ${accent === 'amber' ? 'active' : ''}`} onClick={() => setAccent('amber')} title="Anthropic Amber" />
            <button className={`swatch-btn swatch-cobalt ${accent === 'cobalt' ? 'active' : ''}`} onClick={() => setAccent('cobalt')} title="Modern Cobalt" />
          </div>

          {session && (
            <button className="header-btn" onClick={() => setPreviewModalOpen(true)} title="View top rows of dataset">
              <Icons.Eye /> Preview
            </button>
          )}

          {session && (
            <button className="icon-btn" onClick={clearChat} title="Clear conversation history">
              <Icons.Trash />
            </button>
          )}

          <button className="icon-btn" onClick={toggleTheme} title="Toggle Dark/Light theme">
            {theme === 'dark' ? <Icons.Sun /> : <Icons.Moon />}
          </button>
        </div>
      </header>

      {/* Mobile Drawer Toggle Bar */}
      {session && (
        <div className="mobile-sidebar-toggle" onClick={() => setSidebarOpen(!sidebarOpen)}>
          <span style={{display: 'flex', alignItems: 'center', gap: '6px'}}>
            <Icons.Sheet /> {sidebarOpen ? 'Close Inspector' : 'Dataset Schema & Inquiries'}
          </span>
          <span style={{color: 'var(--accent-text)', fontSize: '11px', maxWidth: '140px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>
            {session.filename}
          </span>
        </div>
      )}

      {/* Mobile Sidebar Backdrop */}
      {sidebarOpen && (
        <div className="sidebar-backdrop" onClick={() => setSidebarOpen(false)} />
      )}

      {/* Main Workspace */}
      <div className="app-workspace">
        {/* Sidebar */}
        <aside className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
          <div className="sidebar-mobile-header">
            <h4>Dataset Inspector</h4>
            <button className="icon-btn" style={{width: '28px', height: '28px'}} onClick={() => setSidebarOpen(false)}>✕</button>
          </div>

          <div className="sidebar-section">
            <div className="section-title">Dataset Source</div>
            {!session ? (
              <div 
                className={`file-dropzone ${dragOver ? 'drag-active' : ''}`}
                onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                onDragLeave={() => setDragOver(false)}
                onDrop={e => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
              >
                <input type="file" accept=".csv,.xlsx,.xls" onChange={e => handleFile(e.target.files[0])} />
                <div className="dropzone-icon"><Icons.Upload /></div>
                <div className="dropzone-title">{uploading ? 'Processing dataset...' : 'Upload Data'}</div>
                <div className="dropzone-meta">CSV, XLSX, XLS · Max 25 MB</div>
              </div>
            ) : (
              <div className="dataset-card">
                <div className="dataset-header">
                  <div className="dataset-icon"><Icons.Sheet /></div>
                  <div className="dataset-filename" title={session.filename}>{session.filename}</div>
                </div>
                <div className="dataset-stats">
                  <span className="stat-badge">{session.rows.toLocaleString()} rows</span>
                  <span className="stat-badge">{session.columns} columns</span>
                </div>
                <div className="dataset-switch-btn" onClick={handleResetDataset}>
                  ← Upload another file
                </div>
              </div>
            )}
          </div>

          {session && (
            <div className="sidebar-section">
              <div className="section-title">
                <span>Schema ({filteredColumns.length})</span>
              </div>
              <div className="column-search">
                <span className="column-search-icon"><Icons.Search /></span>
                <input 
                  type="text" 
                  placeholder="Filter columns..." 
                  value={columnFilter}
                  onChange={e => setColumnFilter(e.target.value)}
                />
              </div>
              <div className="column-list">
                {filteredColumns.map(col => (
                  <div 
                    className="column-row" 
                    key={col}
                    onClick={() => appendColumnToInput(col)}
                    title="Click to insert column name"
                  >
                    <span className="column-name">{col}</span>
                    <span className="col-type-tag tag-txt">COL</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {session && session.suggestions && session.suggestions.length > 0 && (
            <div className="sidebar-section">
              <div className="section-title">Suggested Inquiries</div>
              <div className="prompts-list">
                {session.suggestions.map((s, i) => (
                  <button className="prompt-chip" key={i} onClick={() => sendMessage(s)}>
                    <span>{s}</span>
                    <span className="prompt-arrow">→</span>
                  </button>
                ))}
              </div>
            </div>
          )}
        </aside>

        {/* Chat / Analysis Canvas */}
        <main className="chat-workspace">
          {!session ? (
            <div className="hero-container">
              <div className="hero-badge">
                <Icons.Logo /> Intelligent Analytical Studio
              </div>
              <h1 className="hero-title">
                Ask your data <br /><span>anything in plain English</span>
              </h1>
              <p className="hero-desc">
                Upload your CSV or Excel workbook. Queryza executes Python analysis, computes metrics, and renders interactive Plotly visualizations automatically.
              </p>

              <div 
                className={`hero-upload-card ${dragOver ? 'drag-active' : ''}`}
                onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                onDragLeave={() => setDragOver(false)}
                onDrop={e => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
              >
                <input type="file" accept=".csv,.xlsx,.xls" onChange={e => handleFile(e.target.files[0])} />
                <div className="hero-upload-icon"><Icons.Upload /></div>
                <div style={{fontWeight: 700, fontSize: '15px', marginBottom: '4px'}}>
                  {uploading ? 'Analyzing dataset schema...' : 'Drop your spreadsheet here or click to browse'}
                </div>
                <div style={{fontSize: '12px', color: 'var(--text-muted)'}}>
                  Supports CSV, XLSX, XLS up to 100,000 rows
                </div>
              </div>
            </div>
          ) : (
            <>
              <div className="messages-stream" ref={messagesStreamRef}>
                {messages.length === 0 && (
                  <div style={{textAlign: 'center', color: 'var(--text-muted)', padding: '40px 0', fontSize: '13px'}}>
                    Dataset loaded. Ask a question below or choose a suggested inquiry.
                  </div>
                )}

                {messages.map((msg, i) => (
                  <div className={`msg-row ${msg.role}`} key={i}>
                    {msg.role === 'ai' && (
                      <div className="msg-avatar ai"><Icons.Logo /></div>
                    )}
                    {msg.role === 'user' ? (
                      <div className="msg-bubble-user">{msg.content}</div>
                    ) : (
                      <StudioResultCard msg={msg} theme={theme} accent={accent} onReupload={handleFile} />
                    )}
                  </div>
                ))}

                {loading && (
                  <div className="msg-row ai">
                    <div className="msg-avatar ai"><Icons.Logo /></div>
                    <div className="msg-card-ai" style={{padding: '12px 16px', maxWidth: '180px'}}>
                      <div className="typing-box">
                        <div className="typing-dot" />
                        <div className="typing-dot" />
                        <div className="typing-dot" />
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* Floating Input Dock */}
              <div className="input-dock">
                <div className="input-box">
                  <textarea
                    ref={textareaRef}
                    rows={1}
                    placeholder="Ask a question or request a visualization..."
                    value={input}
                    onChange={onInputChange}
                    onKeyDown={onKeyDown}
                    disabled={loading}
                  />
                  <button 
                    className="send-btn" 
                    onClick={() => sendMessage()} 
                    disabled={loading || !input.trim()}
                    title="Send inquiry"
                  >
                    <Icons.Send />
                  </button>
                </div>
                <div className="input-shortcuts">
                  Press ↵ Enter to send · ⇧ Shift+Enter for new line
                </div>
              </div>
            </>
          )}
        </main>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
